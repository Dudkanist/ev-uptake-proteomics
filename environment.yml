name: default
channels:
- conda-forge
- bioconda
- nodefaults
dependencies:
- python >=3.14.7,<3.15
- numpy >=2.5.3,<3
- pandas >=3.0.5,<4
- scipy >=1.15.0,<2
- statsmodels >=0.14.4,<0.15
- scikit-learn >=1.9.1,<2
- seaborn >=0.13.2,<0.14
- matplotlib >=3.11.2,<4
- requests >=2.34.2,<3
- openpyxl >=3.1.5,<4
- jupyterlab >=4.6.4,<5
- r-base >=4.5.3,<4.6
- bioconductor-limma >=3.68.5,<4
- rpy2 >=3.6.9,<4
variables:
  R_HOME: $PIXI_PROJECT_ROOT/.pixi/envs/default/lib/R
  PATH: $PIXI_PROJECT_ROOT/.pixi/envs/default/lib/R/bin:$PATH

